name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK 33
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n8933bad161af4178b1185d1a2d9f6d1b" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c17" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n601085b94cd77f0d6c3db1c9a4d21c5d" >> "$ANDROID_HOME/licenses/android-sdk-license"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" >/dev/null

      - name: Generate local.properties
        shell: bash
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Download Gradle 8.9
        shell: bash
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle-8.9-bin.zip
          unzip -o -q /tmp/gradle-8.9-bin.zip -d /tmp
          chmod +x /tmp/gradle-8.9/bin/gradle

      - name: Generate Gradle Wrapper 8.9
        shell: bash
        run: |
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        shell: bash
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
